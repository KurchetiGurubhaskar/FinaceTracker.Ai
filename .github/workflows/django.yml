name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: efip_user
          POSTGRES_PASSWORD: efip_password
          POSTGRES_DB: efip_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        
    - name: Run Migrations
      env:
        DB_HOST: localhost
        DB_USER: efip_user
        DB_PASS: efip_password
        DB_NAME: efip_db
        REDIS_URL: redis://localhost:6379/0
      run: |
        cd backend
        python manage.py makemigrations
        python manage.py migrate
        
    - name: Run Tests
      env:
        DB_HOST: localhost
        DB_USER: efip_user
        DB_PASS: efip_password
        DB_NAME: efip_db
        REDIS_URL: redis://localhost:6379/0
      run: |
        cd backend
        python manage.py test
